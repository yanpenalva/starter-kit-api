name: OpenAPI Contract

# Guarded draft workflow for OpenAPI contract generation and artifact publishing.
# Stage A guard: this workflow rejects premature execution before Stage B is unlocked.
#
# Three core pipeline invariants:
# 1. Exact pin: Scramble package is pinned strictly to dedoc/scramble 0.13.47 (never >= or ^);
#    installation is deferred to Stage B after L1 auth freeze (never installed today).
# 2. Stage B exit-1 guard: execution is blocked with exit 1 until controllers, form requests,
#    resources, and custom cookie securityScheme (starter-kit-api-session) are implemented.
# 3. No fake success: this workflow never echoes simulated success or publishes hollow
#    artifacts before real application routes and deterministic export (LC_ALL=C, 2x idempotent)
#    are integrated and verified.
#
# No secrets are required or provisioned in this workflow.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Execution trigger reason (stage B unlock verification)'
        required: true
        default: 'stage-b-verification'

permissions:
  contents: read

jobs:
  contract-draft:
    name: Guarded Contract Export Draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard stage B unlock
        run: |
          echo "ERROR: Stage B is not unlocked yet: awaiting L1 auth freeze and Scramble installation (FEAT-11 stage B)." >&2
          echo "Do not simulate false export success before controllers and Scramble are integrated." >&2
          exit 1
