name: Deploy API release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Deployed environment base URL
        required: true
        type: string
      smoke_origin:
        description: Stateful frontend origin allowed by the API
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.release.outputs.image }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Create immutable release tag
        id: release
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          tag="api-$(date -u +%Y%m%d)-${GITHUB_SHA::12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME,,}:$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject an existing immutable release tag
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing immutable image tag: $IMAGE" >&2
            exit 1
          fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.release.outputs.image }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Prepare SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
      - name: Update immutable image and restart services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ${{ needs.build.outputs.image }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          SSH_KEY: ${{ runner.temp }}/ssh/key
          SSH_KNOWN_HOSTS: ${{ runner.temp }}/ssh/known_hosts
        run: |
          python3 - <<'PY'
          import os
          import shlex
          from pathlib import Path

          values = {name: shlex.quote(os.environ[name]) for name in (
              'DEPLOY_PATH', 'IMAGE', 'REGISTRY_TOKEN', 'REGISTRY_USER'
          )}
          script = f'''set -euo pipefail
          cd {values['DEPLOY_PATH']}
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' {values['REGISTRY_TOKEN']} | docker login ghcr.io -u {values['REGISTRY_USER']} --password-stdin
          export API_IMAGE={values['IMAGE']}
          docker compose --profile release up -d --wait postgres-release redis-release
          docker compose --profile release run --rm --no-deps app php artisan migrate --force
          test -f .env
          if grep -q '^API_IMAGE=' .env; then
            sed -i 's|^API_IMAGE=.*|API_IMAGE={values['IMAGE']}|' .env
          else
            printf '\\nAPI_IMAGE={values['IMAGE']}\\n' >> .env
          fi
          docker compose --profile release up -d app worker-release scheduler-release
          '''
          Path(os.environ['RUNNER_TEMP'], 'deploy.sh').write_text(script)
          PY
          ssh -i "$SSH_KEY" -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s < "$RUNNER_TEMP/deploy.sh"
      - name: Remove SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/deploy.sh"

  smoke:
    needs: deploy
    uses: ./.github/workflows/smoke.yml
    with:
      api_base_url: ${{ inputs.api_base_url || vars.API_BASE_URL }}
      origin: ${{ inputs.smoke_origin || vars.SMOKE_ORIGIN }}
    secrets:
      smoke_email: ${{ secrets.SMOKE_EMAIL }}
      smoke_password: ${{ secrets.SMOKE_PASSWORD }}
