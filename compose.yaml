name: starter-kit-api

x-api: &api
  build:
    context: .
  # API_DEV_IMAGE lets parallel worktrees/test stacks use their own tag
  # (e.g. starter-wave2-async-api:local) so the primary dev image is never
  # overwritten. Default keeps the historical local tag.
  image: ${API_DEV_IMAGE:-starter-kit-api-dev:local}
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  environment:
    APP_ENV: local
    APP_DEBUG: "false"
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_DATABASE: starter_api_dev
    DB_USERNAME: starter_api_dev
    DB_PASSWORD: ${DB_PASSWORD:?Run the documented local environment setup first}
    CACHE_STORE: file
    SESSION_DRIVER: file
    # Safe defaults: the base API stack must not require the async
    # services (no Redis/Mailpit DNS dependency). The async slice
    # (worker/scheduler/test) overrides these explicitly.
    QUEUE_CONNECTION: sync
    MAIL_MAILER: log
    LOG_CHANNEL: stderr

services:
  api:
    <<: *api
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_resource(@fsockopen('127.0.0.1', 9000)) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 12

  nginx:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: starter_api_dev
      POSTGRES_USER: starter_api_dev
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run the documented local environment setup first}
    volumes:
      - postgres-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter_api_dev -d starter_api_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres-test:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    profiles: [test]
    networks: [testing]
    environment:
      POSTGRES_DB: starter_api_test
      POSTGRES_USER: starter_api_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Run the documented local environment setup first}
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter_api_test -d starter_api_test"]
      interval: 5s
      timeout: 3s
      retries: 12

  test:
    <<: *api
    profiles: [test]
    networks: [testing]
    tmpfs:
      - /var/www/html/storage/framework/cache:mode=1777
      - /var/www/html/storage/framework/sessions:mode=1777
      - /var/www/html/storage/framework/testing:mode=1777
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres-test
      DB_DATABASE: starter_api_test
      DB_USERNAME: starter_api_test
      DB_PASSWORD: ${TEST_DB_PASSWORD:?Run the documented local environment setup first}
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: redis
      QUEUE_AFTER_COMMIT: "true"
      REDIS_HOST: redis-test
      REDIS_PORT: "6379"
      REDIS_QUEUE: testqueue
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit-test
      MAIL_PORT: "1025"
      LOG_CHANNEL: stderr
    command: [composer, test]
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      mailpit-test:
        condition: service_healthy

  redis:
    image: redis:alpine@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
    profiles: [async]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis-test:
    image: redis:alpine@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
    profiles: [test]
    networks: [testing]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit@sha256:c076638db1e15662150be4fb62b8a6e96ef6ba5bde90c838a0239225854830f7
    profiles: [async]
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Test-only Mailpit: reachable solely on the internal `testing` network,
  # no host port. Tests peek at synthetic metadata over the HTTP API.
  mailpit-test:
    image: axllent/mailpit@sha256:c076638db1e15662150be4fb62b8a6e96ef6ba5bde90c838a0239225854830f7
    profiles: [test]
    networks: [testing]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Dev-only queue worker (async profile): bounded runtime, redis queue.
  worker:
    <<: *api
    profiles: [async]
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: starter_api_dev
      DB_USERNAME: starter_api_dev
      DB_PASSWORD: ${DB_PASSWORD:?Run the documented local environment setup first}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: redis
      QUEUE_AFTER_COMMIT: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_QUEUE: default
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      LOG_CHANNEL: stderr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [php, artisan, queue:work, redis, "--queue=default", "--tries=3", "--backoff=5,15,60", "--max-jobs=100", "--max-time=3600"]
    healthcheck:
      test: ["CMD", "php", "artisan", "infra:probe", "--key=healthcheck:worker"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Dev-only scheduler (async profile): no production cron definition.
  scheduler:
    <<: *api
    profiles: [async]
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: starter_api_dev
      DB_USERNAME: starter_api_dev
      DB_PASSWORD: ${DB_PASSWORD:?Run the documented local environment setup first}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: redis
      QUEUE_AFTER_COMMIT: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_QUEUE: default
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      LOG_CHANNEL: stderr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [php, artisan, schedule:work]
    healthcheck:
      test: ["CMD", "php", "artisan", "infra:probe", "--key=healthcheck:scheduler"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres-dev:

networks:
  testing:
    internal: true
