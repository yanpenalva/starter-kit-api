name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned oasdiff with SHA256 integrity verification
        run: sudo python3 scripts/install_oasdiff.py --target-dir /usr/local/bin
      - run: python3 scripts/validate_context.py --strict
      - run: python3 scripts/validate_context.py --strict --examples
      - run: python3 -m unittest discover -s tests -v
      - run: npx --yes @owlcodium/context-spec-develop@1.2.1 doctor --scope project

  application:
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: starter_api_test
          POSTGRES_USER: starter_api_test
          POSTGRES_PASSWORD: ci-ephemeral-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter_api_test -d starter_api_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      # FEAT-20: the async integration tests run against REAL queue/mail
      # infrastructure (no fakes, no skips). Images reuse the exact compose
      # pins; nothing is exposed beyond this ephemeral runner, and the
      # credentials follow the same test-only fixture convention as the
      # PostgreSQL service above (none needed: Redis/Mailpit run unauth on
      # loopback for the job only).
      redis-test:
        image: redis:alpine@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
      mailpit-test:
        image: axllent/mailpit@sha256:c076638db1e15662150be4fb62b8a6e96ef6ba5bde90c838a0239225854830f7
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_NAME: 'Starter Kit API'
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: starter_api_test
      DB_USERNAME: starter_api_test
      DB_PASSWORD: ci-ephemeral-test-only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      # FEAT-20 async test fixtures (mirroring the compose `test` slice):
      # afterCommit opt-in expected by AfterCommitDispatchTest, real Redis
      # for the phpredis client, real Mailpit SMTP + HTTP API on loopback.
      QUEUE_AFTER_COMMIT: 'true'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_QUEUE: testqueue
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: '1025'
      MAILPIT_API_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v7
      # FEAT-24: racional em .context/work/FEAT-24/verification.md
      - run: touch .env
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, redis
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: composer audit
      - run: composer lint
      - run: composer analyse
      - run: composer test

  coverage:
    name: Coverage gate (pcov, min 85%)
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: starter_api_test
          POSTGRES_USER: starter_api_test
          POSTGRES_PASSWORD: ci-ephemeral-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter_api_test -d starter_api_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis-test:
        image: redis:alpine@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
      mailpit-test:
        image: axllent/mailpit@sha256:c076638db1e15662150be4fb62b8a6e96ef6ba5bde90c838a0239225854830f7
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_NAME: 'Starter Kit API'
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: starter_api_test
      DB_USERNAME: starter_api_test
      DB_PASSWORD: ci-ephemeral-test-only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      QUEUE_AFTER_COMMIT: 'true'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_QUEUE: testqueue
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: '1025'
      MAILPIT_API_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v7
      - run: touch .env
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, redis
          coverage: pcov
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer test:coverage

  contract:
    name: Contract generation and compatibility
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: starter_api_test
          POSTGRES_USER: starter_api_test
          POSTGRES_PASSWORD: ci-ephemeral-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter_api_test -d starter_api_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_NAME: 'Starter Kit API'
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: starter_api_test
      DB_USERNAME: starter_api_test
      DB_PASSWORD: ci-ephemeral-test-only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      LC_ALL: C
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan migrate --force
      - name: Deterministic export gate (LC_ALL=C, 2x byte-identical)
        run: |
          php artisan scramble:export --path=storage/app/openapi-ci1.json
          php artisan scramble:export --path=storage/app/openapi-ci2.json
          cmp storage/app/openapi-ci1.json storage/app/openapi-ci2.json
      - name: Committed snapshot freshness gate
        run: |
          if [ ! -f contracts/openapi.json ]; then
            echo "ERRO: contracts/openapi.json ausente; gere o snapshot via export do produtor antes do merge." >&2
            exit 1
          fi
          cmp storage/app/openapi-ci1.json contracts/openapi.json
      - name: Structural contract validation (OpenAPI 3.1, root-relative server, session schemes, real surface)
        run: |
          python3 - <<'PY'
          import json, sys
          doc = json.loads(open('contracts/openapi.json', encoding='utf-8').read())
          assert doc.get('openapi') == '3.1.0', 'openapi must be 3.1.0'
          assert str(doc.get('info', {}).get('version', '')).strip() != '', 'info.version required'
          assert doc.get('servers') == [{'url': '/'}], 'server must be root-relative /'
          paths = doc.get('paths', {})
          for required in ('/api/v1', '/api/v1/login', '/api/v1/logout', '/api/v1/auth/my-profile', '/sanctum/csrf-cookie'):
              assert required in paths, f'missing path {required}'
          schemes = doc.get('components', {}).get('securitySchemes', {})
          assert 'sessionCookie' in schemes, 'sessionCookie scheme required'
          assert schemes['sessionCookie'].get('in') == 'cookie', 'sessionCookie must be cookie'
          assert 'bearer' not in {k.lower() for k in schemes}, 'bearer schemes forbidden'
          encoded = json.dumps(doc).lower()
          assert 'personal_access_tokens' not in encoded, 'PAT references forbidden'
          csrf_responses = paths['/sanctum/csrf-cookie']['get']['responses']
          assert '429' not in csrf_responses, 'non-throttled CSRF cookie route must not declare 429'
          assert '204' in csrf_responses, 'CSRF cookie route must declare 204'
          login_responses = paths['/api/v1/login']['post']['responses']
          assert '429' in login_responses, 'throttled login route must declare 429'
          print('Contract structural validation passed.')
          PY
      - name: Install pinned oasdiff with SHA256 integrity verification
        run: sudo python3 scripts/install_oasdiff.py --target-dir /usr/local/bin
      - name: Real breaking changes comparison against resolved immutable baseline
        run: |
          BASE_SHA=$(python3 scripts/resolve_contract_baseline.py)
          echo "Comparando contrato candidato contra baseline imutavel resolvido: ${BASE_SHA}"
          python3 scripts/contract_compat.py --base-commit="${BASE_SHA}" --candidate=contracts/openapi.json
